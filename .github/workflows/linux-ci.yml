name: Linux CI

on:
  push:
    branches: [main, next, develop]
  pull_request:
    branches: [main, next, develop]
  workflow_dispatch:

# Workflow-wide environment variables
env:
  BUILD_TYPE: Debug
  SANITIZER_FLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -O0"
  ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
  UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
  MAKE_JOBS: 32
  CTEST_JOBS: 32
  # ============================================================================
  # ENABLE/DISABLE io_uring TESTING
  # ============================================================================
  # Set to 'true' to enable io_uring build/test (currently has known issues)
  # Set to 'false' to skip io_uring and only test epoll backend (default)
  #
  # To re-enable: Change this to 'true' when ready to continue io_uring work
  # ============================================================================
  ENABLE_IOURING_TESTS: 'true'

  # If ENABLE_CI_TESTING is not 'true' then only check compiles, but don't
  # run tests or report test failures.
  ENABLE_CI_TESTING: 'true'

jobs:
  # ==========================================================================
  # Build + Test - Sequential execution (one compiler at a time)
  # ==========================================================================
  build-test:
    name: "${{ matrix.compiler }} (epoll + io_uring)"
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2  # Limit execution to protect against running many test failures at once
      fail-fast: true  # Stop all jobs if any fails
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Configure epoll build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_FLAGS="${{ env.SANITIZER_FLAGS }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ env.SANITIZER_FLAGS }}"

      - name: Configure io_uring build
        if: env.ENABLE_IOURING_TESTS == 'true'
        run: |
          cmake -B build-iouring -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DUSE_IOURING=ON \
            -DCMAKE_C_FLAGS="${{ env.SANITIZER_FLAGS }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ env.SANITIZER_FLAGS }}"

      - name: Build epoll
        run: make -C build -j${{ env.MAKE_JOBS }}

      - name: Build io_uring
        if: env.ENABLE_IOURING_TESTS == 'true'
        run: make -C build-iouring -j${{ env.MAKE_JOBS }}

      - name: Test epoll
        if: env.ENABLE_CI_TESTING == 'true'
        run: |
          cd build/src
          ctest -j${{ env.CTEST_JOBS }} --output-on-failure

      - name: Test io_uring
        if: env.ENABLE_IOURING_TESTS == 'true'
        run: |
          cd build-iouring/src
          ctest -j${{ env.CTEST_JOBS }} --output-on-failure

  # ==========================================================================
  # Documentation Coverage
  # ==========================================================================
  doxygen-coverage:
    name: "Documentation Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Doxygen documentation coverage
        run: python3 tools/audit_doxygen_coverage.py --fail-on-missing

  # ==========================================================================
  # CI Success Gate
  # ==========================================================================
  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs:
      - build-test
      - doxygen-coverage
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ needs.build-test.result }},${{ needs.doxygen-coverage.result }}"
          if echo "$results" | grep -qE "failure|cancelled"; then
            echo "❌ One or more required jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
