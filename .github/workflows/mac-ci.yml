name: Mac CI

on:
  workflow_dispatch:

# Workflow-wide environment variables
env:
  BUILD_TYPE: Release
  MAKE_JOBS: 32
  CTEST_JOBS: 32

jobs:
  # ==========================================================================
  # Build + Test - Sequential execution (one compiler at a time)
  # ==========================================================================
  build-test:
    name: "${{ matrix.compiler }}"
    runs-on: macos-latest
    strategy:
      max-parallel: 1  # Force sequential execution
      fail-fast: true  # Stop all jobs if any fails
      matrix:
        include:
          - compiler: clang
            cc: clang
            cxx: clang++
          - compiler: gcc
            cc: gcc-15
            cxx: g++-15
            install_gcc: true
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake
          ${{ matrix.install_gcc && 'brew install gcc@15' || 'true' }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: make -C build -j${{ env.MAKE_JOBS }}

      - name: Test
        run: |
          cd build/src
          ctest -j${{ env.CTEST_JOBS }} --output-on-failure

  # ==========================================================================
  # CI Success Gate
  # ==========================================================================
  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [build-test]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ needs.build-test.result }}"
          if echo "$results" | grep -qE "failure|cancelled"; then
            echo "❌ One or more required jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
